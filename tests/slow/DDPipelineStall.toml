# DD Pipeline Stall Reproduction Test
#
# Reproduces the p127/p102 finishMoveKeys cascade in simulation.
#
# === What we're simulating ===
#
# finishMoveKeys wraps waitForShardReady(READABLE) inside a transaction
# that must commit within FDB's ~5s MVCC budget. On the storage server,
# getShardState(READABLE) synchronously blocks on the shard's readWrite
# future (verified in fdbserver/storageserver/storageserver.actor.cpp).
# That future fires only when fetchKeys completes copying the data.
#
# Any shard whose fetchKeys takes longer than 5 seconds therefore
# structurally cannot let its finishMoveKeys commit. The txn ages out
# with transaction_too_old and retries. The relocation actor stays alive
# across retries. Active-relocations counter inflates because new
# launches outpace delayed completions. fetchKeysComplete set grows
# because completions queue behind retrying actors.
#
# Production p127 hit this because 100-500 MB shards took real seconds
# to fetch across the network. To reproduce in simulation with tiny
# shards (5-20 KB, fetch normally in microseconds), we crank one knob:
#
#   storage_fetch_keys_delay = 6.0
#     Each per-shard fetchKeys operation takes 6 sim-seconds. Above the
#     ~5s txn budget by structure. This is the LITERAL production
#     mechanism, not an artificial substitute for a slow-RPC path.
#
# The workload (DDPipelineStall) then drives a continuous rolling
# exclude/include cycle during observe so the retry storm has sustained
# material to compound against.
#
# === What's real vs simulated ===
#
# Real:  finishMoveKeys code path, waitForShardReady inside the txn,
#        FlowLock slots, retry logic, actor lifetime extension,
#        activeRelocations counter inflation, fetchKeysComplete set
#        growth, cluster response to sustained rolling exclude.
# Substituted: shard size. Production shards were 100-500 MB and
#        naturally took seconds to fetch. Our sim shards are 5-20 KB
#        so we scale up fetch time via storage_fetch_keys_delay to
#        recreate the same structural condition.
#
# === Expected signals ===
#
# Baseline (mechanism present):
#   - activeRelocations counter inflates ~6x above healthy baseline
#     (~15 → 91 in this recipe at seed 42)
#   - FetchKeysCompleteSize peaks ~80, sustained across the observe
#     window (48-67 across 15 sim-minutes)
#   - InQueue held at saturation with slow drain
#   - Workload PipelineStalled metric fires
#
# Mechanism fixed (waitForShardReady moved outside the txn):
#   - InFlight peak drops to ~30 (baseline ~15 + normal-work bursts)
#   - FetchKeysCompleteSize stays at 0 throughout — no accumulation
#   - InQueue drains cleanly rather than holding at saturation
#   - PipelineStalled does not fire
#
# See ~/claude_wiki/dd-migration-stuck/writeup-for-pr.md for the full
# before/after story with sim and K8s validation numbers.

[configuration]
config = "triple"
generateFearless = false
# Need enough storage servers so excluding some still leaves a viable cluster
machineCount = 9
processesPerMachine = 1

[[knobs]]
# Tiny shards (5-20 KB): a 1.5 GB dataset produces ~75k shards. Fetches
# would normally complete in microseconds — storage_fetch_keys_delay
# below scales them up to production-size fetch time.
min_shard_bytes = 5000
max_shard_bytes = 20000

# Enable the persistent dataMoves path (required for monitoring AND
# for triggering the p127 death spiral on DD restart)
shard_encode_location_metadata = true

# Allow large trace output (retry storm generates many events).
max_trace_lines = 8000000

# Filter low-priority chatter (Severity=5) — bulkload progress events and similar
# debug logging dominate trace volume but carry no cascade signal. Our cascade
# indicators are Severity=10 (MovingData) and SevWarn/SevWarnAlways
# (DDPipelineStallSample/Detected/RollingExclude*). Sim default is severity 1
# (everything); raising to 10 cuts trace volume by ~5× without losing signal.
min_trace_severity = 10

# Per-shard fetchKeys delay. 6.0 sim-seconds is above FDB's ~5s MVCC
# transaction budget. Any waitForShardReady(READABLE) inside a
# finishMoveKeys transaction blocks on this fetch, exceeds the budget,
# and produces transaction_too_old — the cascade trigger. See
# header block for the full mechanism.
storage_fetch_keys_delay = 6.0
storage_fetch_keys_rate_limit = 500

[[test]]
testTitle = "DDPipelineStall"

    [[test.workload]]
    testName = "DDPipelineStall"
    # 500K keys x 1KB = ~500MB of data
    # With min_shard_bytes=5KB (max=20KB), creates ~25,000 shards
    # Excluding 3/9 moves ~8,000 shards. With 5s fetchKeys delay
    # = ~4,000s to drain. Queue never empties during observe.
    # 1.5M keys × 1KB = ~1.5 GB of data. With min/max shard 5K/20K, creates
    # ~75,000 shards (3× the previous 500K-keys config). Larger keyspace
    # means queue can't fully drain during observe — accumulation can
    # compound across the 15-min observe window.
    keyCount = 1500000
    valueSize = 1000
    # Exclude 2 of 9 storage servers in 2 waves. Leaves 7 SSes for the
    # rolling-exclude phase to cycle through. (Was 5 in 3 waves — too
    # aggressive when combined with rolling, left only 4 SSes and made
    # the cluster freeze rather than cascade.) The initial burst still
    # triggers a meaningful exclude-shaped DD workload; rolling sustains
    # it across the observe window.
    excludeCount = 2
    excludeWaves = 2
    excludeWaveDelay = 30.0
    # Heavier background writes: ~1000 writes/sec (was ~100). Forces dest
    # SSes to do mutation work concurrently with fetchKeys — matches p102.
    backgroundWriteBatchSize = 20
    backgroundWriteDelaySeconds = 0.005
    # Wait 180s (sim time) after data load for DD to split into tiny shards
    loadTimeout = 180.0
    # Observe for 5 minutes (sim). Long enough for sustained rolling
    # exclude/include (below) to compound cascade signature; short
    # enough to keep total run time under an hour.
    observeTime = 300.0
    sampleInterval = 10.0
    # Stall detection: dataMoves accumulating above 50 means finishMoveKeys is stuck
    dataMovesThreshold = 50
    inFlightThreshold = 200
    ddRestartsThreshold = 3

    # Sustain DD work across the observe window by continuously cycling
    # non-permanently-excluded SSes in and out. Without this, the initial
    # wave-exclude burst drains in minutes and the cascade trigger
    # (storage_fetch_keys_delay above the 5s txn budget) has no fresh
    # material to compound against. Production p127 sustained ~50
    # minutes of cascade because mako write traffic + ongoing rebalance
    # kept generating new moves the same way.
    #
    # 20s excluded / 10s pause / 1 SS per cycle produces sustained
    # cascade signature over 15 sim-minutes without crashing the sim
    # host under the ~8 GiB default fdbserver --memory ceiling. More
    # aggressive rolling (2 SSes/cycle, shorter pause) has been
    # observed to crash the sim host at simtime ~1244.
    rollingExclude = true
    rollingCycleSeconds = 20.0
    rollingPauseSeconds = 10.0
    rollingPerCycle = 1
