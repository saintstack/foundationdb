# DD Pipeline Stall Reproduction Test
#
# Reproduces the p127/p102 finishMoveKeys pipeline stall in simulation.
#
# === What we're simulating ===
#
# In production (p127/p102), destination storage servers became CPU-saturated
# from concurrent fetchKeys operations on large shards (100-500MB). At 80% CPU
# with DiskIdle=0, the SS event loop couldn't process getShardState RPCs
# promptly. Each finishMoveKeys retry sent another RPC, adding load, making
# responses even slower — a self-reinforcing feedback loop.
#
# Simulation can't create real CPU contention (single-threaded cooperative
# scheduling), so we fake it with two mechanisms:
#
# 1. storage_fetch_keys_delay = 0.5s — Makes fetchKeys take 0.5s per shard
#    instead of microseconds. Keeps fetchKeysParallelismLock.activePermits() > 0
#    continuously on dest SSes, simulating sustained load from large-shard
#    fetchKeys in production.
#
# 2. buggify_get_shard_state_delay = 3.0 * concurrent_ops — When a dest SS has
#    fetchKeys active AND getShardState calls arriving, each call is delayed
#    proportional to how many are concurrent. Simulates the event loop being
#    busy: more incoming RPCs = longer queue = longer response time.
#    Self-reinforcing: retries add to the queue, making it worse.
#
# The combination: as long as shards are being fetched (mechanism 1 keeps this
# true), every getShardState call is slow (mechanism 2 scales with load).
# waitForShardReady sits inside an open transaction, so the delay pushes it
# past the 5s commit window -> transaction_too_old -> retry at 10ms -> another
# getShardState call -> counter goes up -> delay gets worse.
#
# === What's real vs fake ===
#
# Real: finishMoveKeys code path, FlowLock slots, retry logic, dataMoves
#   accumulation, startMoveKeys outpacing finishMoveKeys, OOM from fetchKeys
#   arena growth
# Fake: the REASON getShardState is slow (artificial delay vs real CPU
#   saturation)
#
# === Expected signals ===
#
# Without fixes:
#   - BytesRate -> 0 (pipeline completely frozen)
#   - dataMoves entries grow monotonically (startMoveKeys >> finishMoveKeys)
#   - InFlight inflates (20x+ over baseline)
#   - Self-sustaining (retry storm feeds itself)
#   - OOM from fetchKeysComplete arena accumulation
#   - With SHARD_ENCODE_LOCATION_METADATA: DD death spiral on restart
#
# With fixes (PRs #12981, #12991, #13112):
#   - Pipeline recovers or never stalls

[configuration]
config = "triple"
generateFearless = false
# Need enough storage servers so excluding some still leaves a viable cluster
machineCount = 9
processesPerMachine = 1

[[knobs]]
# Force tiny shards so 50MB of data creates thousands of shards.
# min=5KB, max=20KB forces DD to split at 20KB boundaries.
# 50MB / 20KB = ~2,500 shards. Excluding 3/9 moves ~800.
min_shard_bytes = 5000
max_shard_bytes = 20000

# Enable the persistent dataMoves path (required for monitoring AND
# for triggering the p127 death spiral on DD restart)
shard_encode_location_metadata = true

# Allow large trace output (retry storm generates many events)
max_trace_lines = 10000000

# Concurrency limit for getShardState on each dest SS.
# When set to N, only N getShardState requests are processed concurrently per SS.
# Additional requests queue up in a FlowLock, simulating CPU contention.
# Self-reinforcing: retries flood the queue → latency grows → more timeouts → more retries.
# At 2: during normal ops (1-2 concurrent) no queuing. After exclude with
# 15 FlowLock slots retrying at 10ms → queue builds → latency explodes → BytesRate→0.
buggify_get_shard_state_delay = 2

# Slow down fetchKeys so activePermits stays > 0 continuously.
# 2.0s is the sweet spot: slow enough to keep permits active but fast
# enough that shards reach READABLE so finishMoveKeys enters the
# transaction phase where the getShardState delay can fire.
# At 5.0s fetchKeys dominates and our delay never triggers.
storage_fetch_keys_delay = 2.0
storage_fetch_keys_rate_limit = 500

[[test]]
testTitle = "DDPipelineStall"

    [[test.workload]]
    testName = "DDPipelineStall"
    # 500K keys x 1KB = ~500MB of data
    # With min_shard_bytes=5KB (max=20KB), creates ~25,000 shards
    # Excluding 3/9 moves ~8,000 shards. With 5s fetchKeys delay
    # = ~4,000s to drain. Queue never empties during observe.
    keyCount = 500000
    valueSize = 1000
    # Exclude 3 of 9 storage servers -> triggers movement of ~1/3 of all shards
    excludeCount = 3
    # Wait 180s (sim time) after data load for DD to split into tiny shards
    loadTimeout = 180.0
    # Observe for 15 minutes — need long window to see sustained stall
    observeTime = 900.0
    sampleInterval = 10.0
    # Stall detection: dataMoves accumulating above 50 means finishMoveKeys is stuck
    dataMovesThreshold = 50
    inFlightThreshold = 200
    ddRestartsThreshold = 3
