# RestoreValidation_Simple.toml
#
# Simple test to validate restore correctness using audit_storage
# Based on BackupS3BlobCorrectness.toml structure (which works reliably)
#
# Flow:
# 1. Cycle generates data
# 2. Backup and restore to \xff\x02/rlog/ prefix
# 3. Validation audits the restored data

testClass = "Backup"

[configuration]
buggify = false
faultInjection = false

[[knobs]]
restore_validation_enabled = 1

[[test]]
testTitle = 'RestoreValidationSimple'
clearAfterTest = false
simBackupAgents = 'BackupToFile'
waitForQuiescenceBegin = false

    [[test.workload]]
    testName = 'Cycle'
    nodeCount = 10000
    transactionsPerSecond = 2500.0
    testDuration = 10.0
    expectedRate = 0

    [[test.workload]]
    testName = 'BackupAndRestoreValidation'
    backupAfter = 60.0
    restoreAfter = 110.0
    addPrefix = '\xff\x02/rlog/'

    [[test.workload]]
    testName = 'RestoreValidation'
    validateAfter = 130.0
    maxWaitTime = 600.0
