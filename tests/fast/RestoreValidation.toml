# RestoreValidation.toml
# 
# This test validates the restore validation feature which compares restored backup data
# with the original source data within the same cluster.
#
# Test workflow:
# 1. Write data with Cycle workload
# 2. Backup data to file
# 3. Restore data with addPrefix to \xff\x02/rlog/ (restoreLogKeys)
# 4. Run audit_storage validate_restore to compare source vs restored data
# 5. Verify validation completes successfully with no errors
#
# The validation feature ensures backup/restore correctness by detecting:
# - Value mismatches between source and restored data
# - Missing keys in restored data
# - Key range violations

testClass = "Backup"

[[knobs]]
# Enable restore validation knobs
restore_validation_enabled = 1
restore_validation = 1

[[test]]
testTitle = 'RestoreValidationCorrectness'
clearAfterTest = false
simBackupAgents = 'BackupToFile'
timeout = 3600

    [[test.workload]]
    testName = 'Cycle'
    nodeCount = 10000
    transactionsPerSecond = 1000.0
    testDuration = 20.0
    expectedRate = 0

    [[test.workload]]
    testName = 'BackupAndRestoreCorrectness'
    backupAfter = 10.0
    restoreAfter = 40.0
    backupRangesCount = 1
    performRestore = true
    # Restore prefix for validation
    # Use 'restored/' for simulation tests (TOML cannot encode binary prefixes)
    # For production/CLI: use '\xff\x02/rlog/' instead
    # The audit code automatically detects which prefix has data
    addPrefix = 'restored/'
    # Don't abort and restart (we want clean restore for validation)
    abortAndRestartAfter = 0
    stopDifferentialAfter = 0

    [[test.workload]]
    testName = 'RestoreValidation'
    validateAfter = 50.0
    expectedPhase = 2  # AuditPhase::Complete
    expectSuccess = true
    checkInterval = 5.0
    maxWaitTime = 600.0

